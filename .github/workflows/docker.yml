name: Publish Docker image

# Builds VIDEPE and publishes it as a Docker image (nginx serving dist/ under /videpe/) to the
# GitHub Container Registry, for deployments that serve VIDEPE themselves, such as Shanoir.
# Runs on the same trigger as the GitHub Pages deploy, so every release publishes both.

on:
  push:
    branches:
      - main
  workflow_dispatch: # manual run (Actions tab → Run workflow), e.g. to test from a branch

permissions:
  contents: read
  packages: write # push to ghcr.io with the built-in GITHUB_TOKEN

env:
  # Registry image names must be lowercase (the repository is VIDEPE/videpe)
  IMAGE: ghcr.io/videpe/videpe

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Releases (main) get the package.json version + latest, e.g. 0.19.0 and latest.
      # Manual runs from another branch only build the image (not pushed, see push: below); the
      # dev-<commit> tag just gives that local build a name.
      - name: Choose image tags
        id: tags
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            VERSION=$(node -p "require('./package.json').version")
            echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Links the package to this repository on GitHub (shown on the repo's Packages)
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

<!doctype html>
<html lang="en">
  <head>
    <!-- text encoding (é, ü, … display correctly) -->
    <meta charset="UTF-8" />
    <!-- correct scaling on phones/tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- browser tab text -->
    <title>VIDEPE</title>
    <!-- browser tab icon -->
    <link rel="icon" type="image/svg+xml" href="/brain-circuit.svg" />
    <!-- This switches the theme before the page is rendered, to avoid a flash of the wrong theme -->
    <script src="theme-init.js"></script>
    <!-- Runtime config (deployment settings, see public/app-config.js); must load before the app -->
    <script src="app-config.js"></script>
  </head>
  <body>
    <!-- empty box: React draws the whole app in here -->
    <div id="root"></div>
    <!-- starts the app -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

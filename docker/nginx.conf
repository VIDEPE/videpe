# nginx config for running the VIDEPE image on its own (docker run), e.g. to test a build.
# Shanoir doesn't use this file: they copy only the videpe/ folder into their own nginx.
server {
    listen 80;
    root /usr/share/nginx/html;
    # Redirect with a path only ("/videpe/"), not a full URL: nginx would put its own port (80)
    # in it, which breaks when the container is reached through another port (-p 8080:80)
    absolute_redirect off;

    # The app lives under /videpe/ (vite.config.js base), so send the bare root there
    # i.e. whoever opens http://localhost:8080/ is sent to /videpe/, since nothing lives at the root
    location = / {
        return 302 /videpe/;
    }

    location /videpe/ {
        # Same CSP as proposed for Shanoir's /videpe/ location, so CSP problems show up locally
        # (in the browser console) before they reach Shanoir
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'" always;

        # Deployment config: never cached ("no-store"), so a replaced app-config.js takes effect right away
        location = /videpe/app-config.js {
            add_header Cache-Control "no-store" always;
        }
    }
}
